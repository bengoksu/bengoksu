<style><![CDATA[
  .sw { animation: sway 4s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:bottom center; }
  .sw2 { animation-duration: 4.6s; animation-delay: -2s }
  .sw3 { animation-duration: 3.5s; animation-delay: -1s }
  .flutter {animation: flutter 6s ease-in-out infinite alternate;}
  .twinkle {animation: twinkle 3s ease-in-out infinite alternate;}
  @keyframes sway { from {transform:rotate(-3deg)} to {transform:rotate(3deg)} }
  @keyframes flutter { from {transform:translate(0px, 0px)} to {transform:translate(18px,-16px)} }
  @keyframes twinkle { from{opacity:.2}to{opacity:1} }
  @media (prefers-reduced-motion:reduce){.sw,.flutter,.twinkle{animation:none}}
]]></style>
